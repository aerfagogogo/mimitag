name: mimitag
options:
  bundleIdPrefix: com.sunyiting
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: CHK3SLQ5JM
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: auto
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.8.0"
targets:
  mimitag:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macCatalyst
    sources:
      - path: Sources
        # 本机 Agent 配置目录不属于 App 源码；排除后避免 XcodeGen 每次为
        # 空 `.claude` 目录生成随机 TEMP group，造成不可复现的工程文件 diff。
        excludes:
          - "**/.claude"
          - "**/.claude/**"
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/en.lproj/InfoPlist.strings
        buildPhase: resources
      - path: Resources/zh-Hans.lproj/InfoPlist.strings
        buildPhase: resources
      - path: ../../docs/privacy-policy.md
        group: Resources
        buildPhase: resources
      - path: ../../docs/terms-of-use.md
        group: Resources
        buildPhase: resources
      - path: ../../docs/support.md
        group: Resources
        buildPhase: resources
      - path: ../../LICENSE
        group: Resources
        buildPhase: resources
      - path: ../../THIRD_PARTY_NOTICES.md
        group: Resources
        buildPhase: resources
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunyiting.mimitag
        PRODUCT_NAME: mimitag
        PRODUCT_MODULE_NAME: mimitag
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "INFOPLIST_FILE[sdk=macosx*]": Resources/Info-Catalyst.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Resources/mimitag-Catalyst.entitlements
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]": AppIconMac
        SDKROOT: auto
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MACCATALYST_OPTIMIZED_FOR_MAC: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": "YES"
        # UI 文案统一由显式 L10n key 管理，关闭编译器自动提取，避免 Xcode 把技术字符串写回目录。
        SWIFT_EMIT_LOC_STRINGS: "NO"
        CURRENT_PROJECT_VERSION: "100064"
        MARKETING_VERSION: "1.0"
  mimitagTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations:
      - iOS
      - macCatalyst
    sources:
      - path: Tests
        excludes:
          - mimitagTests/ConversationSnapshotTests.swift
      - path: Tests/mimitagTests/ConversationSnapshotTests.swift
        destinationFilters:
          - iOS
    dependencies:
      - target: mimitag
      - package: SnapshotTesting
        destinationFilters:
          - iOS
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunyiting.mimitagTests
        SDKROOT: auto
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MACCATALYST_OPTIMIZED_FOR_MAC: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/mimitag.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/mimitag"
        BUNDLE_LOADER: "$(TEST_HOST)"
  mimitagUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/mimitagUITests
    dependencies:
      - target: mimitag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunyiting.mimitagUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: mimitag
